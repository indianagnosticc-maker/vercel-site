<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LIVE INTEL</title>
<style>
  :root{
    --bg:#03070d;
    --land:#0a1018;
    --water:#071a14;
    --green:#00ff88;
    --green-dim:#0a6b3d;
    --green-glow:rgba(0,255,136,.4);
    --line:#132a42;
    --txt:#c5e8d5;
    --dim:#4a7360;
    --red:#ff2d55;
    --amber:#ffb703;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg); color:var(--txt); overflow:hidden;
    font-family:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
    position:fixed; inset:0;
  }

  #map{
    position:absolute; inset:0;
    background:var(--water);
    overflow:hidden;
  }
  #map svg{ display:block; width:100vw; height:100vh; touch-action:none; cursor:grab; }
  #map svg:active{ cursor:grabbing; }

  #map::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:
      repeating-linear-gradient(0deg, rgba(0,255,136,.014) 0 1px, transparent 1px 3px),
      radial-gradient(circle at 50% 50%, transparent 35%, rgba(0,0,0,0.5) 100%);
    z-index:5;
  }

  .hud-tl{
    position:absolute; top:12px; left:12px; z-index:10;
    background:rgba(5,10,18,0.72); border:1px solid var(--line);
    border-radius:3px; padding:7px 10px; backdrop-filter:blur(10px);
    font-size:9.5px; letter-spacing:1.3px; line-height:1.65;
    color:var(--dim); pointer-events:none;
  }
  .hud-tl .row{ display:flex; gap:8px; }
  .hud-tl .row b{ color:var(--green); font-weight:500; }
  .hud-tl .live{
    display:inline-flex; align-items:center; gap:6px; color:var(--green);
    margin-bottom:4px; letter-spacing:2px;
  }
  .dot-live{
    width:6px; height:6px; border-radius:50%; background:var(--green);
    box-shadow:0 0 8px var(--green);
    animation:pulse 1.8s infinite ease-in-out;
  }
  @keyframes pulse{
    0%,100%{opacity:1; transform:scale(1)}
    50%{opacity:.35; transform:scale(.75)}
  }

  .hud-tr{
    position:absolute; top:12px; right:12px; z-index:10;
    background:rgba(5,10,18,0.72); border:1px solid var(--line);
    border-radius:3px; padding:7px 10px; backdrop-filter:blur(10px);
    font-size:9.5px; letter-spacing:1.3px; line-height:1.65; text-align:right;
    color:var(--dim); pointer-events:none;
  }
  .hud-tr b{ color:var(--green); font-weight:500; }

  .hud-bottom{
    position:absolute; bottom:0; left:0; right:0; z-index:10;
    background:linear-gradient(0deg, rgba(3,7,13,0.92), rgba(3,7,13,0.55) 70%, transparent);
    border-top:1px solid var(--line);
    padding:8px 12px; display:flex; justify-content:space-between;
    font-size:9.5px; letter-spacing:1.3px; color:var(--dim);
    pointer-events:none;
  }
  .hud-bottom b{ color:var(--green); font-weight:500; }

  .fab{
    position:absolute; right:16px; bottom:56px; z-index:20;
    width:52px; height:52px; border-radius:50%;
    background:linear-gradient(145deg, rgba(0,255,136,0.16), rgba(0,255,136,0.04));
    border:1px solid rgba(0,255,136,0.5);
    box-shadow:
      0 0 18px rgba(0,255,136,0.35),
      0 0 40px rgba(0,255,136,0.12),
      inset 0 0 12px rgba(0,255,136,0.08);
    color:var(--green);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:all .25s cubic-bezier(.16,1,.3,1);
    font-family:inherit;
  }
  .fab:active{ transform:scale(0.96); }
  .fab svg{ width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; }
  .fab.open{
    background:linear-gradient(145deg, rgba(255,45,85,0.16), rgba(255,45,85,0.04));
    border-color:rgba(255,45,85,0.5); color:var(--red);
    box-shadow:0 0 18px rgba(255,45,85,0.35);
  }

  .panel{
    position:absolute; top:0; left:0; bottom:0; z-index:30;
    width:min(360px, 88vw);
    background:linear-gradient(180deg, rgba(5,10,18,0.97), rgba(3,7,13,0.99));
    border-right:1px solid var(--line);
    backdrop-filter:blur(14px);
    transform:translateX(-102%);
    transition:transform .42s cubic-bezier(.16,1,.3,1);
    display:flex; flex-direction:column;
    box-shadow:6px 0 32px rgba(0,0,0,0.6);
  }
  .panel.open{ transform:translateX(0); }

  .panel-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .panel-title{
    font-size:12px; letter-spacing:3px; color:var(--green);
    text-shadow:0 0 8px var(--green-glow); font-weight:700;
  }
  .panel-close{
    background:transparent; border:1px solid var(--line); color:var(--dim);
    width:28px; height:28px; border-radius:3px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-family:inherit; font-size:14px;
    transition:all .15s;
  }
  .panel-close:hover{ color:var(--red); border-color:var(--red); }

  .mode-tabs{
    display:flex; gap:6px; padding:10px 14px;
    border-bottom:1px solid var(--line); flex-shrink:0;
    overflow-x:auto; -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .mode-tabs::-webkit-scrollbar{ display:none; }
  .mode-tab{
    background:transparent; border:1px solid var(--line); border-radius:3px;
    color:var(--dim); font:inherit; font-size:10.5px; letter-spacing:1.5px;
    padding:7px 12px; cursor:pointer; transition:all .18s; white-space:nowrap;
    text-transform:uppercase;
  }
  .mode-tab.active{
    color:var(--green); border-color:rgba(0,255,136,0.4);
    background:rgba(0,255,136,0.08);
    text-shadow:0 0 6px var(--green-glow);
  }

  .panel-body{
    flex:1; overflow-y:auto; padding:14px;
    -webkit-overflow-scrolling:touch;
  }
  .panel-body::-webkit-scrollbar{ width:4px; }
  .panel-body::-webkit-scrollbar-thumb{ background:var(--line); border-radius:2px; }

  .graph-card{
    border:1px solid var(--line); border-radius:4px;
    background:rgba(10,16,25,0.5);
    padding:12px; margin-bottom:14px;
  }
  .graph-title{
    font-size:10px; letter-spacing:2px; color:var(--dim);
    text-transform:uppercase; margin-bottom:8px;
    display:flex; justify-content:space-between;
  }
  .graph-title b{ color:var(--green); font-weight:500; }
  .graph-canvas{ width:100%; height:80px; display:block; }

  .info-row{
    display:grid; grid-template-columns:110px 1fr; gap:10px;
    font-size:11.5px; padding:6px 0;
    border-bottom:1px dashed rgba(0,255,136,.07);
    align-items:baseline;
  }
  .info-row:last-child{ border-bottom:0; }
  .info-row .k{ color:var(--red); text-transform:uppercase; letter-spacing:1px; font-size:10px; }
  .info-row .v{ color:var(--green); word-break:break-word; }
  .info-row .v.hi{ color:#fff; font-weight:600; }

  .empty-hint{
    text-align:center; color:var(--dim); font-size:11px;
    letter-spacing:1.2px; padding:30px 10px; line-height:1.7;
    text-transform:uppercase;
  }
  .empty-hint .big{
    display:block; font-size:24px; color:var(--green-dim); margin-bottom:10px;
    letter-spacing:4px;
  }

  .flight-dot{
    fill: var(--green);
    filter: drop-shadow(0 0 3px rgba(0,255,136,0.9));
    cursor:pointer;
    transition: r .15s ease, filter .15s ease;
  }
  .flight-dot:hover{
    r: 2.2;
    filter: drop-shadow(0 0 6px rgba(0,255,136,1));
  }
  .flight-dot.selected{
    fill: #ffffff;
    filter: drop-shadow(0 0 6px rgba(0,255,136,1));
  }
</style>
</head>
<body>

<div id="map"></div>

<div class="hud-tl">
  <div class="live"><span class="dot-live"></span> LIVE INTEL</div>
  <div class="row">NODE <b>ASIA-SOUTH-01</b></div>
  <div class="row">FLIGHTS <b id="flights-count">0</b></div>
</div>

<div class="hud-tr">
  <div>UTC <b id="clock">--:--:--</b></div>
  <div>SESSION <b id="session-id">----</b></div>
</div>

<div class="hud-bottom">
  <span>MODE <b id="mode-label">FLIGHTS</b></span>
  <span>ZOOM <b id="zoom-label">1.00x</b></span>
  <span>LAT <b id="lat-label">--.--</b></span>
  <span>LON <b id="lon-label">--.--</b></span>
</div>

<button class="fab" id="fab" aria-label="Open intel panel">
  <svg viewBox="0 0 24 24">
    <path d="M3 12h4l3-8 4 16 3-8h4"/>
  </svg>
</button>

<aside class="panel" id="panel">
  <div class="panel-head">
    <div class="panel-title">INTEL PANEL</div>
    <button class="panel-close" id="panel-close" aria-label="Close panel">✕</button>
  </div>

  <div class="mode-tabs" id="mode-tabs">
    <button class="mode-tab active" data-mode="flights">FLIGHTS</button>
    <button class="mode-tab" data-mode="quakes">QUAKES</button>
    <button class="mode-tab" data-mode="sats">SATS</button>
    <button class="mode-tab" data-mode="ships">SHIPS</button>
  </div>

  <div class="panel-body" id="panel-body">
    <div class="graph-card">
      <div class="graph-title">
        <span>FLIGHTS IN AIR · LIVE</span>
        <b id="graph-live">0</b>
      </div>
      <canvas class="graph-canvas" id="graph-canvas"></canvas>
    </div>

    <div id="info-body">
      <div class="empty-hint">
        <span class="big">◉</span>
        TAP ANY PLANE<br>
        ON THE MAP<br>
        TO VIEW INTEL
      </div>
    </div>
  </div>
</aside>

<script>
const D3_URL    = "https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js";
const TOPO_URL  = "https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js";
const WORLD_GEO = "https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json";
const API_FLIGHTS = "/api/flights";
const REFRESH_MS = 15000; // 15s — matches edge cache

const $ = s => document.querySelector(s);

const CFG = {
  land:       "#0a1018",
  water:      "#071a14",
  green:      "#00ff88",
  gridMinor:  "rgba(0,255,136,0.05)",
  graticuleStep: 15,
};

let svg, gMap, gGrid, gFlights, projection, path, zoom;
let flightsData = [];
let selectedIcao = null;

function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = res;
    s.onerror = rej;
    document.head.appendChild(s);
  });
}

function setClock(){
  const d = new Date();
  $("#clock").textContent = d.toISOString().substr(11,8);
}
setInterval(setClock, 1000); setClock();

$("#session-id").textContent = Math.random().toString(36).substr(2,6).toUpperCase();

async function boot(){
  if (!window.d3)       await loadScript(D3_URL);
  if (!window.topojson) await loadScript(TOPO_URL);

  const world = await fetch(WORLD_GEO).then(r => r.json());
  const countries = topojson.feature(world, world.objects.countries);

  svg = d3.select("#map")
    .append("svg")
    .attr("viewBox", `0 0 200 100`)
    .attr("preserveAspectRatio", "xMidYMid slice");

  const root = svg.append("g").attr("class","root");

  projection = d3.geoEquirectangular().fitSize([200, 100], {type:"Sphere"});
  path = d3.geoPath(projection);

  gGrid = root.append("g").attr("class","grid");
  const graticule = d3.geoGraticule().step([CFG.graticuleStep, CFG.graticuleStep]);
  gGrid.append("path")
    .datum(graticule())
    .attr("d", path)
    .attr("fill","none")
    .attr("stroke", CFG.gridMinor)
    .attr("stroke-width", 0.08);

  gMap = root.append("g").attr("class","map");

  gMap.append("path")
    .datum({type:"Sphere"})
    .attr("d", path)
    .attr("fill", CFG.water);

  gMap.selectAll("path.country")
    .data(countries.features)
    .enter()
    .append("path")
    .attr("class","country")
    .attr("d", path)
    .attr("fill", CFG.land)
    .attr("stroke", "none");

  // flights layer (above land)
  gFlights = root.append("g").attr("class","flights");

  zoom = d3.zoom()
    .scaleExtent([1, 20])
    .on("zoom", (ev) => {
      gMap.attr("transform", ev.transform);
      gGrid.attr("transform", ev.transform);
      gFlights.attr("transform", ev.transform);
      $("#zoom-label").textContent = ev.transform.k.toFixed(2) + "x";
    });

  svg.call(zoom);

  startGraph();

  // first load
  await loadFlights();
  setInterval(loadFlights, REFRESH_MS);
}

/* flight data + render */
async function loadFlights(){
  try{
    const r = await fetch(API_FLIGHTS);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    if (!data.flights) return;

    flightsData = data.flights;
    $("#flights-count").textContent = flightsData.length;

    renderFlights();
  }catch(e){
    console.warn("flights load failed:", e);
  }
}

function renderFlights(){
  // bind by icao
  const sel = gFlights.selectAll("circle.flight-dot")
    .data(flightsData, d => d.icao);

  sel.exit().remove();

  sel.enter()
    .append("circle")
    .attr("class","flight-dot")
    .attr("r", 0.9)
    .on("click", (ev, d) => {
      ev.stopPropagation();
      selectFlight(d);
    })
    .merge(sel)
    .attr("cx", d => projection([d.lon, d.lat])[0])
    .attr("cy", d => projection([d.lon, d.lat])[1])
    .classed("selected", d => d.icao === selectedIcao);
}

function selectFlight(f){
  selectedIcao = f.icao;

  // visual highlight
  gFlights.selectAll("circle.flight-dot")
    .classed("selected", d => d.icao === f.icao);

  // fill panel
  const alt_ft = Math.round((f.alt || 0) * 3.28084);
  const vel_kmh = Math.round((f.vel || 0) * 3.6);
  const vrate_fpm = Math.round((f.vrate || 0) * 196.85);

  const html = `
    <div class="info-row"><div class="k">callsign</div><div class="v hi">${esc(f.callsign)}</div></div>
    <div class="info-row"><div class="k">icao24</div><div class="v">${esc(f.icao)}</div></div>
    <div class="info-row"><div class="k">country</div><div class="v">${esc(f.country)}</div></div>
    <div class="info-row"><div class="k">latitude</div><div class="v">${f.lat.toFixed(4)}</div></div>
    <div class="info-row"><div class="k">longitude</div><div class="v">${f.lon.toFixed(4)}</div></div>
    <div class="info-row"><div class="k">altitude</div><div class="v">${alt_ft.toLocaleString()} ft</div></div>
    <div class="info-row"><div class="k">speed</div><div class="v">${vel_kmh.toLocaleString()} km/h</div></div>
    <div class="info-row"><div class="k">heading</div><div class="v">${Math.round(f.track)}°</div></div>
    <div class="info-row"><div class="k">vert rate</div><div class="v">${vrate_fpm > 0 ? "+" : ""}${vrate_fpm} fpm</div></div>
    <div class="info-row"><div class="k">squawk</div><div class="v">${esc(f.squawk || "----")}</div></div>
  `;
  $("#info-body").innerHTML = html;
}

function esc(s){
  return String(s ?? "").replace(/[&<>"]/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]
  ));
}

/* graph */
function startGraph(){
  const canvas = $("#graph-canvas");
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;

  function resize(){
    const rect = canvas.getBoundingClientRect();
    canvas.width  = rect.width  * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  window.addEventListener("resize", resize);

  const points = new Array(60).fill(0);

  function draw(){
    const w = canvas.width / dpr;
    const h = canvas.height / dpr;
    ctx.clearRect(0,0,w,h);

    ctx.strokeStyle = "rgba(0,255,136,0.06)";
    ctx.lineWidth = 1;
    for (let i = 1; i < 4; i++){
      ctx.beginPath();
      ctx.moveTo(0, (h/4)*i);
      ctx.lineTo(w, (h/4)*i);
      ctx.stroke();
    }

    const maxV = Math.max(100, ...points);
    ctx.beginPath();
    points.forEach((v, i) => {
      const x = (i / (points.length - 1)) * w;
      const y = h - (v / maxV) * h * 0.85 - 4;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = "rgba(0,255,136,0.85)";
    ctx.lineWidth = 1.5;
    ctx.shadowBlur = 8;
    ctx.shadowColor = "rgba(0,255,136,0.5)";
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.lineTo(w, h);
    ctx.lineTo(0, h);
    ctx.closePath();
    const grad = ctx.createLinearGradient(0,0,0,h);
    grad.addColorStop(0, "rgba(0,255,136,0.22)");
    grad.addColorStop(1, "rgba(0,255,136,0)");
    ctx.fillStyle = grad;
    ctx.fill();

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  setInterval(() => {
    points.shift();
    points.push(flightsData.length);
    $("#graph-live").textContent = flightsData.length.toLocaleString();
  }, 1500);
}

/* panel + fab */
const fab = $("#fab");
const panel = $("#panel");
fab.addEventListener("click", () => {
  panel.classList.toggle("open");
  fab.classList.toggle("open");
});
$("#panel-close").addEventListener("click", () => {
  panel.classList.remove("open");
  fab.classList.remove("open");
});

document.querySelectorAll(".mode-tab").forEach(t => {
  t.addEventListener("click", () => {
    document.querySelectorAll(".mode-tab").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    $("#mode-label").textContent = t.dataset.mode.toUpperCase();
  });
});

/* coords readout */
function updateCoords(clientX, clientY){
  const svgEl = document.querySelector("#map svg");
  if (!svgEl || !projection) return;
  const rect = svgEl.getBoundingClientRect();
  const vx = ((clientX - rect.left) / rect.width) * 200;
  const vy = ((clientY - rect.top) / rect.height) * 100;
  const inv = projection.invert([vx, vy]);
  if (!inv) return;
  const [lon, lat] = inv;
  if (isFinite(lat) && isFinite(lon)){
    $("#lat-label").textContent = lat.toFixed(2);
    $("#lon-label").textContent = lon.toFixed(2);
  }
}
document.addEventListener("mousemove", e => updateCoords(e.clientX, e.clientY));
document.addEventListener("touchmove", e => {
  if (e.touches[0]) updateCoords(e.touches[0].clientX, e.touches[0].clientY);
}, {passive:true});

boot().catch(err => {
  console.error(err);
  document.getElementById("map").innerHTML =
    '<div style="color:#ff2d55;padding:30px;font:12px monospace;letter-spacing:1.5px">MAP LOAD FAILED: ' + err.message + '</div>';
});
</script>
</body>
</html>
